name: quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --extra agent --extra documents
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy app evals
      - run: uv run pytest
      - run: uv run python -m evals.score_retrieval
      - run: uv run python -m evals.score_grounding
      - run: uv build
